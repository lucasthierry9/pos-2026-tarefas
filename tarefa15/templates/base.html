<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cliente SUAP{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f3f6fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #eef4ff 0%, #f7f9fc 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, .75);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            box-shadow: none;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .card {
            background: var(--card);
            border: none;
            border-radius: 22px;
            box-shadow:
                0 10px 30px rgba(15, 23, 42, .05),
                0 2px 6px rgba(15, 23, 42, .03);
            transition: .25s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        .btn {
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-outline-primary,
        .btn-outline-success {
            border-width: 2px;
        }

        .table {
            margin-bottom: 0;
        }

        .table th {
            color: var(--muted);
            font-weight: 600;
        }

        .badge {
            border-radius: 999px;
            padding: .6rem .9rem;
            font-weight: 600;
        }

        footer {
            color: #9ca3af;
            font-size: .9rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    {% if user_data %}
        <nav class="navbar navbar-expand-lg py-3">
            <div class="container">
                <a class="navbar-brand" href="/">
                Cliente SUAP
                </a>

                <div class="d-flex align-items-center ms-auto">
                <div class="text-end me-3">
                    <div class="fw-semibold">
                    {{ user_data.nome_usual }}
                    </div>

                    <small class="text-secondary">
                    {{ user_data.matricula }}
                    </small>
                </div>

                <img
                    src="{{ user_data['url_foto_150x200'] }}"
                    class="avatar me-4">

                <a class="btn btn-outline-primary me-2" href="/perfil">
                    Perfil
                </a>

                <a class="btn btn-outline-success me-2" href="/boletim">
                    Boletim
                </a>

                <a class="btn btn-danger" href="/logout">
                    Sair
                </a>
                </div>
            </div>
        </nav>
    {% endif %}

    <div class="container py-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center pb-4">
        Cliente SUAP • Flask + OAuth
    </footer>

</body>
</html>
